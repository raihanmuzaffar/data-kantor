providers = ["php"]

[variables]
NIXPACKS_PHP_VERSION = "8.3"

[phases.install]
cmds = [
  "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs"
]

[phases.build]
cmds = [
  "mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache",
  "chmod -R 775 storage bootstrap/cache"
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
